spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB_SNIPPET}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER_SNIPPET}
    password: ${POSTGRES_PASSWORD_SNIPPET}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate

  asset:
    service:
      url: ${ASSET_SERVICE_URL}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId:-N/A}] - %msg%n"
  level:
    root: INFO