spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB_SNIPPET}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER_SNIPPET}
    password: ${POSTGRES_PASSWORD_SNIPPET}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  redis:
    stream:
      snippet:
        key: snippet-events

  asset:
    service:
      url: ${ASSET_SERVICE_URL}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI}

authorization:
  service:
    url: ${AUTHORIZATION_SERVICE_URL}

auth0:
  audience: ${AUTH0_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always