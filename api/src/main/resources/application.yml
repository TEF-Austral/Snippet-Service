spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:formatter-db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update

  asset:
    service:
      url: ${ASSET_SERVICE_URL:http://localhost/api/assets/v1/asset}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always