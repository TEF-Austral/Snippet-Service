plugins {
    id 'buildlogic.kotlin-common-conventions'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation("org.springframework.boot:spring-boot-starter-oauth2-client")
    implementation("org.springframework.boot:spring-boot-starter-data-redis")
    implementation project(':events')
    implementation project(':commondata')
    implementation project(':commondto')
    implementation project(':commoncontracts')
    implementation project(':authorization')
    implementation project(':security')
    implementation project(':snippets')
    implementation project(':assets')
    implementation project(':language')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-reactor'
    implementation("com.newrelic.agent.java:newrelic-api:8.11.0")
    implementation("org.springframework.boot:spring-boot-starter-websocket")
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation('org.austral.ingsis:redis-streams-mvc:0.1.13')
}

tasks.named('bootJar') {
    enabled = true
}

tasks.named('jar') {
    enabled = false
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

springBoot {
    mainClass = 'api.SnippetServiceApplicationKt'
}
